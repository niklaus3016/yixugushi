<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      // Apply persisted theme before first paint to avoid a flash of the
      // default (day) theme. Keys mirror useLocalPoetryStore (incl. legacy).
      (function () {
        try {
          var keys = [
            'com.yxgs.app.global_config_v1',
            'yixu_global_config_v1',
          ];
          for (var i = 0; i < keys.length; i++) {
            var raw = window.localStorage.getItem(keys[i]);
            if (!raw) continue;
            var cfg = JSON.parse(raw);
            if (cfg && cfg.theme) {
              document.documentElement.setAttribute('data-theme', cfg.theme);
              break;
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
